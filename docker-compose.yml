services:
  ollama:
    image: ollama/ollama:latest
    container_name: iap_tutor_ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    command: serve
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  web:
    build: .
    container_name: iap_tutor_web
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      - ollama
    command: uvicorn server.main:app --host 0.0.0.0 --port 8000

volumes:
  ollama_data: