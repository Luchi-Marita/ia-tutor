# Blueprint de despliegue en Render.
# Crea dos servicios: el servidor Ollama (LLM) y el gateway web (FastAPI).
# IMPORTANTE: el plan Standard es necesario (4 GB RAM) para ejecutar llama3.2.
services:
  - type: web
    name: ia-tutor-ollama
    runtime: docker
    dockerContext: ./
    dockerfilePath: ./deploy/Dockerfile.ollama
    plan: standard
    healthCheckPath: /
    disk:
      name: ollama-models
      mountPath: /root/.ollama
      sizeGB: 6
    envVars:
      - key: MODELO
        value: llama3.2

  - type: web
    name: ia-tutor-web
    runtime: docker
    dockerContext: ./
    dockerfilePath: ./Dockerfile
    plan: standard
    healthCheckPath: /health
    envVars:
      - key: OLLAMA_URL
        value: https://ia-tutor-ollama.onrender.com
      - key: MODELO
        value: llama3.2